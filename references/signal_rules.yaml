# 宏观高频监测 · 信号规则
# 依据 Spec §18 / §20 / §37 / §39。
# 铁律：数值判定由代码执行，LLM 只解释已算好的 signal。禁止让模型算 zscore/percentile/change。
version: "2.0"

# 所有生产判定值的唯一真源。脚本只解释这些声明，不保存第二份默认阈值。
standardization:
  windows:
    daily:     { z1y: 250, p3y: 750, p5y: 1250 }
    weekly:    { z1y: 52,  p3y: 156, p5y: 260 }
    monthly:   { z1y: 12,  p3y: 36,  p5y: 60 }
    quarterly: { z1y: 4,   p3y: 12,  p5y: 20 }
  min_samples: { zscore: 4, percentile: 4, change_extreme: 20 }

score_mapping:
  center: 50
  z_scale: 20
  minimum: 0
  maximum: 100
  bands:
    - { min: 62, label: 明显扩张 }
    - { min: 55, label: 温和扩张 }
    - { min: 45, label: 中性震荡 }
    - { min: 38, label: 温和收缩 }
    - { min: 0,  label: 明显收缩 }

dimension_signal:
  positive_z: 0.5
  negative_z: -0.5

deviation:
  notable_change_extreme: 0.90
  strong_change_extreme: 0.97
  position_z_extreme: 2.0
  position_percentile_high: 0.99
  position_percentile_low: 0.01
  oi_change_extreme: 0.30
  display_limit_per_side: 6

anomaly:
  z_extreme: 2.0
  percentile_low: 0.05
  percentile_high: 0.95
  move_extreme: 0.95
  same_direction_count: 3
  high_severity_triggers: [ZSCORE_EXTREME, PERCENTILE_LOW, PERCENTILE_HIGH]

futures_signal:
  tradable_max_calendar_days: 7
  tier_min_members: 2
  tier_gap_medium: 0.05
  tier_gap_high: 0.10

display:
  movers_limit: 10
  anomaly_limit: 10
  futures_movers_limit: 12

divergence_defaults:
  positive_z: 0.5
  negative_z: -0.5
  minimum_usable_members: 2

# ---------- 标准化阈值 ----------
signal_rules:
  zscore:
    strong_positive: 1.0
    positive: 0.5
    neutral_low: -0.5
    negative: -1.0
  percentile:
    extreme_low: 0.05
    low: 0.20
    high: 0.80
    extreme_high: 0.95
  change:
    five_day_extreme: 0.95      # 5D 变化处于历史 95% 分位
    twenty_day_extreme: 0.95

# ---------- 方向语义 ----------
# 每个指标在 registry 里自带 direction，此处定义语义与打分映射。
#
# ⚠️ polarity 定义：**数值上升**对「宏观扩张 / 风险偏好」是正向(+1) 还是负向(-1)。
#    这是六维打分的唯一方向口径，新增 direction 标签时必须同时在此登记，
#    否则 macro-snapshot.mjs 会把该指标降级为 contextual 并排除出评分。
direction_semantics:
  higher_is_stronger: { polarity: 1,  meaning: 越高越景气（增长/外需类），数值上升为正向 }
  lower_is_stronger:  { polarity: -1, meaning: 越低越强，数值上升为负向 }
  higher_is_tighter:  { polarity: -1, meaning: 越高越紧（利率/通胀类），数值上升为负向 }
  lower_is_tighter:   { polarity: 1,  meaning: 越低越紧，数值上升为正向 }
  higher_is_looser:   { polarity: 1,  meaning: 越高越宽松（货币/信用总量类，如 M2、社融），数值上升为正向 }
  lower_is_looser:    { polarity: -1, meaning: 越低越宽松（资金利率类），数值上升为负向 }
  contextual:         { polarity: 0,  meaning: 方向依情境，不参与自动打分，仅报数值 }

# ---------- 六维权重（DRAFT · 未回测） ----------
# ⚠️ Spec §20：以下为结构示例。生产权重必须经
#   ① 字段可用性确认 ② 历史覆盖长度检查 ③ 高相关指标处理 ④ 回测 后才可冻结。
#   当前标记 draft，mean_reversion 前不得用于下注决策。
weight_profile:
  status: draft
  normalizer: zscore_1y
  aggregation: weighted_mean
  score_range: [0, 100]
  score_center: 50
  dimensions:
    growth:
      CN_PMI: 0.20
      CN_PMI_PROD: 0.12
      CN_PMI_ORDER: 0.12
      CN_IP: 0.20
      HF_COPPER: 0.11
      HF_COPPER_SPOT: 0.11
      HF_REBAR: 0.14
    consumption:
      CN_RETAIL: 0.45
      CN_RETAIL_CATERING: 0.25
      HF_AUTO_PROD: 0.30
    property:
      CN_RE_INV: 0.20
      CN_RE_START: 0.18
      CN_RE_COMPLETE_YOY: 0.14
      CN_RE_SALES_YOY: 0.22
      HF_GLASS: 0.13
      HF_REBAR: 0.13
    inflation:
      CN_CPI: 0.20
      CN_CPI_FOOD: 0.10
      CN_CPI_NONFOOD: 0.14
      CN_PPI: 0.22
      CN_PMI_PRICE: 0.10
      HF_PORK: 0.12
      HF_BRENT: 0.12
    liquidity:
      MKT_DR007: 0.22
      MKT_R007: 0.10
      MKT_CGB_10Y: 0.18
      MKT_CURVE_10Y1Y: 0.12
      CN_M2: 0.14
      CN_TSF: 0.14
      MKT_CREDIT_SPREAD_3Y: 0.10
    external:
      CN_EXPORT: 0.30
      CN_IMPORT: 0.14
      CN_PMI_EXPORT: 0.16
      HF_BALTIC: 0.14
      MKT_USDCNY: 0.26

# ---------- 异常触发（Spec §37） ----------
# 满足任意一条即标记 RESEARCH_CANDIDATE
anomaly_triggers:
  - id: ZSCORE_EXTREME
    condition: "abs(zscore_1y) >= 2"
  - id: PERCENTILE_LOW
    condition: "percentile_3y <= 0.05"
  - id: PERCENTILE_HIGH
    condition: "percentile_3y >= 0.95"
  - id: FIVE_DAY_MOVE_EXTREME
    condition: "abs(d5) >= percentile_history_95"
  - id: THREE_SAME_DIRECTION
    condition: "count(dimension_signals == same_direction) >= 3"
  - id: CROSS_ASSET_DIVERGENCE
    condition: "see divergence_rules below"

# ---------- 背离检测（Spec §39，本模块最高价值功能之一） ----------
divergence_rules:
  - id: MACRO_MARKET_DIVERGENCE
    name_cn: 宏观高频改善 vs 金融市场不确认
    evaluator: opposite_majority
    value_field: dirZ
    minimum_usable_members: 2
    side_a: { label: 宏观高频, members: [CN_PMI, CN_PMI_ORDER, HF_COPPER, CN_RE_SALES_AREA, HF_REBAR] }
    side_b: { label: 市场确认, members: [MKT_CGB_10Y, MKT_HS300, MKT_USDCNY] }
    logic_cn: 两侧方向校正后的多数信号相反时触发。
    question: 为什么经济高频在改善，但金融市场并不确认？
    severity: high

  - id: PROPERTY_CREDIT_DIVERGENCE
    name_cn: 地产销售 vs 地产信用
    evaluator: opposite_mean
    value_field: dirZ
    minimum_usable_members: 2
    side_a: { label: 地产销售, members: [CN_RE_SALES_YOY, CN_RE_START] }
    side_b: { label: 信用确认, members: [MKT_AAA_3Y, MKT_CREDIT_SPREAD_3Y] }
    logic_cn: 地产销售与信用支持度均值方向相反时触发。
    question: 地产是否出现信用周期反转？
    severity: high

  - id: LIQUIDITY_GROWTH_DIVERGENCE
    name_cn: 资金面宽松 vs 增长预期
    evaluator: opposite_majority
    value_field: dirZ
    minimum_usable_members: 2
    side_a: { label: 流动性支持, members: [MKT_DR007, MKT_R007] }
    side_b: { label: 增长确认, members: [MKT_CGB_10Y, CN_PMI_ORDER] }
    logic_cn: 流动性支持与增长确认的多数信号相反时触发。
    question: 宽松为何未能传导至增长预期？
    severity: medium

  - id: EXTERNAL_INTERNAL_DIVERGENCE
    name_cn: 外需 vs 内需
    evaluator: opposite_mean
    value_field: dirZ
    minimum_usable_members: 2
    side_a: { label: 外需, members: [CN_EXPORT, CN_PMI_EXPORT, HF_BALTIC] }
    side_b: { label: 内需, members: [CN_RETAIL, CN_IP] }
    logic_cn: 外需与内需的方向校正均值相反时触发。
    question: 外需拉动能否对冲内需疲弱？
    severity: medium

# ---------- 新鲜度判定（Spec §13） ----------
freshness:
  daily:
    fresh_within_calendar_days: 1
    stale_after_calendar_days: 4
    discontinued_after_calendar_days: 60
  weekly:
    fresh_within_calendar_days: 8
    stale_after_calendar_days: 21
  monthly:
    fresh_within_calendar_days: 45
    stale_after_calendar_days: 75
  quarterly:
    fresh_within_calendar_days: 130
    stale_after_calendar_days: 200
  states: [FRESH, EXPECTED, STALE, DISCONTINUED, MISSING, ERROR]
  rule: >-
    月频指标在其下一个发布窗口到来前，一律视为 EXPECTED，不得判为 STALE。
    例：CPI 最新观测 2026-08，频率 monthly → EXPECTED（因为 9 月 CPI 尚未发布）。

# ---------- 市场归因权重（DeerFlow 介入门槛，Spec §38） ----------
escalation:
  default_path: "Data Pipeline → Dashboard"
  research_path: "Data Pipeline → RESEARCH_CANDIDATE → DeerFlow → 研究解释"
  trigger_conditions:
    - anomaly_triggers_hit >= 1
    - divergence_rules_hit >= 1
  suppress:
    - 常规日常更新不调用 LLM
    - 单指标小幅波动不调用 LLM
