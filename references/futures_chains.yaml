# 期货产业链监控 · 配置层
#
# 归属：宏观高频监测 Skill 的第二个配置文件。
# 分工：indicator_registry.yaml 管宏观指标（参与六维评分）；本文件管期货全品种（展示与产业链分析，不参与六维评分）。
#
# 依据 Spec §6 / §17：所有 field_code 均由 scripts/macro-probe-futures.mjs 实测取得，无一处猜测。
generated_at: "2026-09-10"
window: { begin: "2025-07-10", end: "2026-09-10" }

# 价差语义与行业系数唯一真源。运行时仅解释列出的 operation。
spreads:
  - id: FUT_SPREAD_REBAR_ORE
    name_cn: 螺纹-铁矿价差
    operation: linear_combination
    terms: [{ member: FUT_RB, coefficient: 1.0 }, { member: FUT_I, coefficient: -1.6 }]
    unit: cny_per_ton
    change_mode: abs
    desc: 高炉即期利润代理；价差压缩代表原料对钢厂利润的侵蚀增强。
  - id: FUT_SPREAD_COKE_COAL
    name_cn: 焦炭-焦煤价差
    operation: linear_combination
    terms: [{ member: FUT_J, coefficient: 1.0 }, { member: FUT_JM, coefficient: -1.3 }]
    unit: cny_per_ton
    change_mode: abs
    desc: 焦化利润代理；价差走阔代表焦化环节利润改善。
  - id: FUT_SPREAD_PTA_PX
    name_cn: PTA-PX价差
    operation: linear_combination
    terms: [{ member: FUT_TA, coefficient: 1.0 }, { member: FUT_PX, coefficient: -0.655 }]
    unit: cny_per_ton
    change_mode: abs
    desc: 聚酯加工费代理，反映 PX 与 PTA 之间的利润分配。
  - id: FUT_SPREAD_GOLD_SILVER
    name_cn: 金银比
    operation: ratio
    numerator: { member: FUT_AU, multiplier: 1000 }
    denominator: { member: FUT_AG, multiplier: 1 }
    unit: ratio
    change_mode: pct
    desc: 避险与工业属性相对强弱的辅助读数。
  - id: FUT_SPREAD_OIL_MEAL
    name_cn: 油粕比
    operation: ratio
    numerator: { member: FUT_Y, multiplier: 1 }
    denominator: { member: FUT_M, multiplier: 1 }
    unit: ratio
    change_mode: pct
    desc: 压榨价值在油脂与蛋白之间的相对分配。
  - id: FUT_SPREAD_SA_FG
    name_cn: 纯碱-玻璃价差
    operation: linear_combination
    terms: [{ member: FUT_SA, coefficient: 0.2 }, { member: FUT_FG, coefficient: -1.0 }]
    unit: cny_per_ton
    change_mode: abs
    desc: 浮法玻璃的纯碱原料成本压力代理。

# 交易所后缀实测更正（手册未记载或有误）
exchange_notes:
  - { exchange: 郑州商品交易所, manual_says: .ZCE, actual: .CZC, note: 手册写错，实测 FG00.ZCE 全部 -4210 }
  - { exchange: 广州期货交易所, manual_says: 未记载, actual: .GFE, note: 实测 GFEX/GF/GZ/GFA 均 -4210，仅 .GFE 通过 }

# THS_HQ 期货专用字段（经 lookup_field_reference 确认）
hq_fields:
  base: [open, high, low, close, volume, amount]
  futures_specific: [openInterest, positionChange, settlement, preSettlement, change_settlement, chg_settlement]
  default_request: "close;high;low;open;volume;amount;changeRatio;openInterest"
  note: 持仓量字段名为 openInterest；position/settle/hold 等猜测名会被静默忽略，不报错但也不返回值

# ============================================================
# 产业链分组与上下游分层
# ============================================================
futures_chains:
  - id: ferrous
    name_cn: "黑色·煤焦钢"
    desc: "地产与基建的实物需求温度计。铁矿+双焦是成本端，钢材是产成品端，螺纹与地产施工同步性最高。"
    tiers:
      - { name_cn: "上游原料", members: [FUT_I, FUT_JM, FUT_J, FUT_ZC] }
      - { name_cn: "中游合金", members: [FUT_SF, FUT_SM] }
      - { name_cn: "下游钢材", members: [FUT_RB, FUT_HC, FUT_SS] }
    edges:
      - { source: FUT_JM, target: FUT_J, relation: coking }
      - { source: FUT_I, target: FUT_RB, relation: steelmaking }
      - { source: FUT_I, target: FUT_HC, relation: steelmaking }
      - { source: FUT_J, target: FUT_RB, relation: steelmaking }
      - { source: FUT_J, target: FUT_HC, relation: steelmaking }
      - { source: FUT_SF, target: FUT_RB, relation: alloy_input }
      - { source: FUT_SM, target: FUT_RB, relation: alloy_input }
  - id: nonferrous
    name_cn: "有色金属"
    desc: "全球定价、金融属性最强的一类。铜是宏观需求的领先指标，铝受能耗与电解成本约束。"
    tiers:
      - { name_cn: "上游原料", members: [FUT_AO] }
      - { name_cn: "基本金属", members: [FUT_CU, FUT_AL, FUT_ZN, FUT_PB, FUT_NI, FUT_SN, FUT_BC] }
    edges:
      - { source: FUT_AO, target: FUT_AL, relation: smelting_input }
  - id: energy
    name_cn: "能源"
    desc: "原油是化工与运输成本的源头。燃料油/沥青/低硫燃料油是原油的直接裂解产物。"
    tiers:
      - { name_cn: "上游原油", members: [FUT_SC] }
      - { name_cn: "下游油品", members: [FUT_FU, FUT_LU, FUT_BU, FUT_PG] }
    edges:
      - { source: FUT_SC, target: FUT_FU, relation: refining }
      - { source: FUT_SC, target: FUT_LU, relation: refining }
      - { source: FUT_SC, target: FUT_BU, relation: refining }
  - id: chemical
    name_cn: "化工"
    desc: "三条主链：聚酯（PX→PTA→短纤/瓶片）、烯烃（甲醇/乙二醇→PP/塑料/PVC）、氯碱建材（纯碱→玻璃、烧碱→PVC）。链内价差反映加工利润的分配。"
    tiers:
      - { name_cn: "上游原料", members: [FUT_PX, FUT_MA, FUT_EG, FUT_SA, FUT_SH, FUT_EB, FUT_RU, FUT_NR, FUT_BR, FUT_SP] }
      - { name_cn: "下游成品", members: [FUT_TA, FUT_PF, FUT_PR, FUT_PP, FUT_L, FUT_V, FUT_FG, FUT_UR] }
    edges:
      - { source: FUT_PX, target: FUT_TA, relation: feedstock }
      - { source: FUT_TA, target: FUT_PF, relation: polyester }
      - { source: FUT_TA, target: FUT_PR, relation: polyester }
      - { source: FUT_EG, target: FUT_PF, relation: polyester }
      - { source: FUT_EG, target: FUT_PR, relation: polyester }
      - { source: FUT_MA, target: FUT_PP, relation: methanol_to_olefins }
      - { source: FUT_MA, target: FUT_L, relation: methanol_to_olefins }
      - { source: FUT_SA, target: FUT_FG, relation: feedstock }
      - { source: FUT_SH, target: FUT_V, relation: chlor_alkali_coproduct }
  - id: precious
    name_cn: "贵金属"
    desc: "实际利率与避险的镜像。金是货币属性，银兼具工业属性，金银比是风险偏好的辅助读数。"
    tiers:
      - { name_cn: "品种", members: [FUT_AU, FUT_AG] }
    edges: []
  - id: ags
    name_cn: "农产品"
    desc: "天气与养殖周期驱动。油脂油料看南美/东南亚供给，玉米与豆粕决定养殖成本，生猪是通胀的末端读数。"
    tiers:
      - { name_cn: "上游原料", members: [FUT_A, FUT_C, FUT_P, FUT_LG] }
      - { name_cn: "下游成品", members: [FUT_M, FUT_Y, FUT_OI, FUT_RM, FUT_CS, FUT_JD, FUT_LH, FUT_SR, FUT_CF, FUT_AP, FUT_PK] }
    edges:
      - { source: FUT_A, target: FUT_M, relation: crushing }
      - { source: FUT_A, target: FUT_Y, relation: crushing }
      - { source: FUT_C, target: FUT_CS, relation: processing }
  - id: newenergy
    name_cn: "新能源·航运"
    desc: "广期所新能源金属反映产能周期与需求预期；集运欧线是外需与运力的直接读数。"
    tiers:
      - { name_cn: "新能源金属", members: [FUT_SI, FUT_LC, FUT_PS] }
      - { name_cn: "航运", members: [FUT_EC] }
    edges: []

